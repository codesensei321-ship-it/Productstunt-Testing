version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: productstunt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: staging_password
      POSTGRES_DB: productstunt
    command: -c shared_buffers=64MB -c max_connections=25 -c work_mem=4MB
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d productstunt"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    container_name: productstunt_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    networks:
      - internal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: productstunt_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_bots --if-empty &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 3 --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      - ./backend:/app
      - ./data/profiles:/data/profiles
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: productstunt_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1} -n worker1@%h
    shm_size: '512mb'
    volumes:
      - ./backend:/app
      - ./data/profiles:/data/profiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal_network

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: productstunt_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    networks:
      - internal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: productstunt_frontend
    restart: unless-stopped
    command: npm run start
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
